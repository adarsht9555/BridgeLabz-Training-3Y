<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - CSS Tooltip Demonstration</title>
    <link rel="stylesheet" href="Q2.css">
</head>
<body>
    <header>
        <h1>Pure CSS Tooltips</h1>
        <p>Hover over any highlighted text or button to trigger a smooth fading tooltip.</p>
    </header>

    <main class="tooltip-wrapper">
        <!-- Tooltip Element 1 -->
        <div class="tooltip-container">
            <span class="tooltip-trigger">Hover Me (Text)</span>
            <div class="tooltip-box">This is a text tooltip!</div>
        </div>

        <!-- Tooltip Element 2 -->
        <div class="tooltip-container">
            <button class="tooltip-btn">Action Button</button>
            <div class="tooltip-box">Click to perform action</div>
        </div>

        <!-- Tooltip Element 3 -->
        <div class="tooltip-container">
            <span class="tooltip-icon">i</span>
            <div class="tooltip-box">Information details shown here.</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Pure CSS Tooltip Showcase</p>
    </footer>
</body>
</html>
