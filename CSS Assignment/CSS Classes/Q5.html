<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Styled Button Collection</title>
    <link rel="stylesheet" href="Q5.css">
</head>
<body>
    <header>
        <h1>Styled Button Collection</h1>
        <p>Demonstrating primary, secondary, outline, disabled, hover, active, and focus states.</p>
    </header>

    <main class="button-container">
        <!-- Primary Button -->
        <div class="button-card">
            <h3>Primary Button</h3>
            <button class="btn btn-primary">Primary Action</button>
        </div>

        <!-- Secondary Button -->
        <div class="button-card">
            <h3>Secondary Button</h3>
            <button class="btn btn-secondary">Secondary Action</button>
        </div>

        <!-- Outline Button -->
        <div class="button-card">
            <h3>Outline Button</h3>
            <button class="btn btn-outline">Outline Action</button>
        </div>

        <!-- Disabled Button -->
        <div class="button-card">
            <h3>Disabled Button</h3>
            <button class="btn btn-disabled" disabled>Disabled State</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 UI Component Kit</p>
    </footer>
</body>
</html>
