<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 - Image Showcase Layout</title>
    <link rel="stylesheet" href="Q3.css">
</head>
<body>
    <header>
        <h1>Modern Image Showcase</h1>
        <p>A responsive grid layout featuring hover zoom and darkening effects</p>
    </header>

    <main>
        <section class="showcase-grid">
            <!-- Image Item 1 -->
            <figure class="showcase-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=1" alt="Mountain View">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain Sunset</figcaption>
            </figure>

            <!-- Image Item 2 -->
            <figure class="showcase-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=2" alt="Ocean Waves">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean Horizon</figcaption>
            </figure>

            <!-- Image Item 3 -->
            <figure class="showcase-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=3" alt="Forest Trail">
                    <div class="overlay"></div>
                </div>
                <figcaption>Forest Sanctuary</figcaption>
            </figure>

            <!-- Image Item 4 -->
            <figure class="showcase-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=4" alt="City Lights">
                    <div class="overlay"></div>
                </div>
                <figcaption>Metropolis Night</figcaption>
            </figure>

            <!-- Image Item 5 -->
            <figure class="showcase-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=5" alt="Desert Dunes">
                    <div class="overlay"></div>
                </div>
                <figcaption>Desert Dunes</figcaption>
            </figure>

            <!-- Image Item 6 -->
            <figure class="showcase-card">
                <div class="image-wrapper">
                    <img src="https://picsum.photos/400/300?random=6" alt="Arctic Glaciers">
                    <div class="overlay"></div>
                </div>
                <figcaption>Arctic Glaciers</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Image Showcase Gallery</p>
    </footer>
</body>
</html>
