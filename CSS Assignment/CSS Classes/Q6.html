<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - CSS Keyframe Animations</title>
    <link rel="stylesheet" href="Q6.css">
</head>
<body>
    <header>
        <h1>CSS Keyframe Animations</h1>
        <p>Demonstrating moving, bouncing, and color-shifting animation timing properties.</p>
    </header>

    <main class="animation-stage">
        <!-- Animated Element 1: Moving Box -->
        <div class="anim-box flex-item">
            <div class="moving-box"></div>
            <span>Moving Box</span>
        </div>

        <!-- Animated Element 2: Bouncing Ball -->
        <div class="anim-box flex-item">
            <div class="bouncing-ball"></div>
            <span>Bouncing Ball</span>
        </div>

        <!-- Animated Element 3: Color Shift Text -->
        <div class="anim-box flex-item">
            <h2 class="color-text">Chameleon Text</h2>
            <span>Color Shift</span>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 CSS Keyframe Animations Lab</p>
    </footer>
</body>
</html>
