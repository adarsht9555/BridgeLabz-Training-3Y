<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="Q8.css">
</head>
<body>
    <main>
        <h1>CSS Box Model</h1>
        <section class="demo">
            <div class="margin">
                <div class="border">
                    <div class="padding">
                        <div class="content">CONTENT</div>
                    </div>
                </div>
            </div>
        </section>
        <section class="info">
            <p><b>Content:</b> actual text or element area.</p>
            <p><b>Padding:</b> space inside the border.</p>
            <p><b>Border:</b> line surrounding padding.</p>
            <p><b>Margin:</b> outside space around the element.</p>
        </section>
    </main>
</body>
</html>
