<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Photo Gallery with Hover Zoom</title>
    <link rel="stylesheet" href="Q8.css">
</head>
<body>
    <header>
        <h1>Dynamic Photo Gallery</h1>
    </header>

    <main class="gallery-wrapper">
        <figure class="gallery-card">
            <div class="img-box">
                <img src="https://picsum.photos/400/300?random=31" alt="Mountain View">
            </div>
            <figcaption>Mountain Sunset</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-box">
                <img src="https://picsum.photos/400/300?random=32" alt="Ocean Horizon">
            </div>
            <figcaption>Ocean Waves</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-box">
                <img src="https://picsum.photos/400/300?random=33" alt="Forest Trail">
            </div>
            <figcaption>Forest Sanctuary</figcaption>
        </figure>

        <figure class="gallery-card">
            <div class="img-box">
                <img src="https://picsum.photos/400/300?random=34" alt="City Lights">
            </div>
            <figcaption>Metropolis Skyline</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Responsive Grid Gallery</p>
    </footer>
</body>
</html>
