<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - 3D Card Flip Animation</title>
    <link rel="stylesheet" href="Q9.css">
</head>
<body>
    <main class="flip-stage">
        <!-- 3D Flip Container -->
        <div class="flip-card">
            <div class="flip-inner">
                <!-- Front Side -->
                <div class="flip-front">
                    <img src="https://picsum.photos/300/200?random=40" alt="Card Image">
                    <h2>Card Title</h2>
                </div>

                <!-- Back Side -->
                <div class="flip-back">
                    <h2>Description</h2>
                    <p>This is the back side of the card, revealed using 3D CSS rotateY transformations on hover.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
