<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 - Responsive Typography</title>
  <link rel="stylesheet" href="Q4.css">
</head>
<body>
  <main class="content-box">
    <h1>Fluid Typography Demo</h1>
    <p>
      This paragraph scales smoothly based on the viewport width using the CSS <code>clamp()</code> function. 
      Fluid typography creates a seamless scaling effect between minimum and maximum bounds without relying strictly on multiple media query breakpoints.
    </p>
  </main>
</body>
</html>
