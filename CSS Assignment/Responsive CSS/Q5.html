<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Filter Cards with Animation</title>
  <link rel="stylesheet" href="Q5.css">
</head>
<body>
  <header>
    <h1>Our Creative Team</h1>
  </header>

  <main class="cards-container">
    <div class="profile-card fade-in">
      <img src="https://picsum.photos/300/300?random=10" alt="Team Member 1" class="grayscale-filter">
      <h3>Sarah Jenkins</h3>
      <p>Lead UI/UX Designer crafting visual interfaces.</p>
    </div>

    <div class="profile-card fade-in">
      <img src="https://picsum.photos/300/300?random=11" alt="Team Member 2" class="sepia-filter">
      <h3>David Chen</h3>
      <p>Senior Frontend Developer building web apps.</p>
    </div>

    <div class="profile-card fade-in">
      <img src="https://picsum.photos/300/300?random=12" alt="Team Member 3" class="grayscale-filter">
      <h3>Elena Rostova</h3>
      <p>Product Manager overseeing design workflows.</p>
    </div>
  </main>
</body>
</html>
