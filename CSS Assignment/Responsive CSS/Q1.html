<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="Q1.css">
</head>
<body>
  <header>
    <h1>Responsive Image Filter Gallery</h1>
    <p>Hover over any image to remove its CSS filter smoothly.</p>
  </header>

  <main>
    <section class="gallery-grid">
      <figure class="gallery-item">
        <img src="https://picsum.photos/400/300?random=1" alt="Blur Filter Example" class="filter-blur">
        <figcaption>Blur Filter (Hover to clear)</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/400/300?random=2" alt="Grayscale Filter Example" class="filter-grayscale">
        <figcaption>Grayscale Filter</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/400/300?random=3" alt="Sepia Filter Example" class="filter-sepia">
        <figcaption>Sepia Filter</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/400/300?random=4" alt="Brightness Filter Example" class="filter-brightness">
        <figcaption>Brightness Filter</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/400/300?random=5" alt="Contrast Filter Example" class="filter-contrast">
        <figcaption>Contrast Filter</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/400/300?random=6" alt="Hue Rotate Filter Example" class="filter-huerotate">
        <figcaption>Hue-Rotate Filter</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Responsive CSS Gallery. All rights reserved.</p>
  </footer>
</body>
</html>
