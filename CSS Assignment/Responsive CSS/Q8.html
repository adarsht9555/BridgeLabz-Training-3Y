<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Filter Comparison Layout</title>
  <link rel="stylesheet" href="Q8.css">
</head>
<body>
  <header>
    <h1>Before & After Filter Comparison</h1>
    <p>Hover over the filtered image to reveal the original un-filtered shot.</p>
  </header>

  <main class="comparison-container">
    <figure class="img-box">
      <img src="https://picsum.photos/600/400?random=30" alt="Original Image">
      <figcaption>Before (Original)</figcaption>
    </figure>

    <figure class="img-box">
      <img src="https://picsum.photos/600/400?random=30" alt="Filtered Image" class="filtered">
      <figcaption>After (High Contrast Filter - Hover to clear)</figcaption>
    </figure>
  </main>
</body>
</html>
