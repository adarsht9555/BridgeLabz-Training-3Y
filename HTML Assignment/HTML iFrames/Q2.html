<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 2 - Google Map iFrame</title>
</head>
<body>
    <h1>Google Map Location</h1>
    <!-- 
        The loading="lazy" attribute defers loading of the iframe until it comes close to 
        the user's viewport while scrolling. This improves overall web page loading speed 
        and saves bandwidth.
    -->
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3549.400528254476!2d78.03956731506374!3d27.175144783015485!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39747121d702ff6d%3A0xdd2ae4803f767dde!2sTaj%20Mahal!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin" 
        title="Google Map showing Agra City" 
        width="600" 
        height="450" 
        loading="lazy">
    </iframe>
</body>
</html>
