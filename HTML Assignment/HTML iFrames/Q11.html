<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 11 - Student Information Form</title>
</head>
<body>
    <h1>Student Information Registration</h1>
    <form action="#" method="post">
        <label for="student_name">Student Name:</label><br>
        <input type="text" id="student_name" name="student_name" required><br><br>

        <label for="roll_number">Roll Number:</label><br>
        <input type="text" id="roll_number" name="roll_number" required><br><br>

        <label for="course">Select Course:</label><br>
        <select id="course" name="course" required>
            <!-- Default option: selected and disabled -->
            <option value="" disabled selected>Select Course</option>
            <option value="btech">B.Tech Computer Science</option>
            <option value="bca">Bachelor of Computer Applications (BCA)</option>
            <option value="bsc">B.Sc Data Science</option>
            <option value="mca">Master of Computer Applications (MCA)</option>
        </select><br><br>

        <input type="submit" value="Submit Student Info">
    </form>
</body>
</html>
