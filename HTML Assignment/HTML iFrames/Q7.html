<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 7 - Login Form with CSRF Token</title>
</head>
<body>
    <h1>User Login Form</h1>
    <!-- 
        CSRF (Cross-Site Request Forgery) Token Purpose:
        A CSRF token is a unique, secret, and unpredictable token generated by the server 
        and transmitted to the client. It ensures that the incoming form submission originates 
        from the legitimate user and authentic web page, preventing unauthorized malicious requests.
    -->
    <form action="#" method="post">
        <!-- Hidden input field containing dummy CSRF token -->
        <input type="hidden" name="csrf_token" value="d9a8f7c6e5b4a3210987654321fedcba">

        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <input type="submit" value="Login">
    </form>
</body>
</html>
