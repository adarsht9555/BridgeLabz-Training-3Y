<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 15 - Payment Gateway Form</title>
</head>
<body>
    <h1>Secure Credit / Debit Card Payment</h1>
    <form action="#" method="post">
        <label for="cardholder">Cardholder Name:</label><br>
        <input type="text" id="cardholder" name="cardholder" placeholder="Name as printed on card" required><br><br>

        <label for="cardnumber">Card Number:</label><br>
        <input type="text" id="cardnumber" name="cardnumber" placeholder="1234 5678 9101 1121" required><br><br>

        <label for="expiry">Expiry Date:</label><br>
        <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required><br><br>

        <label for="cvv">CVV Code:</label><br>
        <input type="password" id="cvv" name="cvv" placeholder="123" required><br><br>

        <input type="submit" value="Pay Now">
    </form>
</body>
</html>
