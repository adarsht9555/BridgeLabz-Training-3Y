<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 9 - File Upload Form</title>
</head>
<body>
    <h1>Upload Profile Picture</h1>
    <p>Note: Only image files with <strong>.jpg</strong> or <strong>.png</strong> extensions are allowed for upload.</p>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="userfile">Select Image File:</label><br>
        <input type="file" id="userfile" name="userfile" accept=".jpg, .png, image/jpeg, image/png" required><br><br>

        <input type="submit" value="Upload File">
    </form>
</body>
</html>
