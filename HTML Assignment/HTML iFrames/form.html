<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 17 - Form Page</title>
</head>
<body>
    <h1>Submit Data to iFrame Target</h1>
    <!-- Form targets the iframe below to display result.html after clicking Submit -->
    <form action="result.html" method="get" target="submission_frame">
        <label for="userdata">Enter Text Input:</label><br>
        <input type="text" id="userdata" name="userdata" required><br><br>
        <input type="submit" value="Submit">
    </form>

    <br>
    <h2>Submission Output Window:</h2>
    <iframe name="submission_frame" width="500" height="150" title="Result Window"></iframe>
</body>
</html>
