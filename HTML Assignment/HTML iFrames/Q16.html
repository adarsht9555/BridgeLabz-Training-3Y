<body>
    <h1>URI Encoding Example</h1>
    <p>Below is a hyperlink containing special encoded characters (spaces encoded as <code>%20</code> and ampersand as <code>%26</code>):</p>
    <p>
        <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for "HTML &amp; CSS" (Encoded Link)</a>
    </p>
</body>
