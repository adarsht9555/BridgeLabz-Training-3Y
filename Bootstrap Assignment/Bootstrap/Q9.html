<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Blog Pagination & Pager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Q9.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <h1 class="fw-bold text-center mb-4">Tech News Blog</h1>

        <!-- Sample blog cards -->
        <div class="row g-4 mb-5">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3">
                    <h2 class="h5 fw-bold">Bootstrap 5.3 Features</h2>
                    <p class="text-muted mb-0">Exploring color modes, dynamic CSS variables, and utility API extensions.</p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3">
                    <h2 class="h5 fw-bold">The Future of Web Specs</h2>
                    <p class="text-muted mb-0">What to expect in frontend standards and browser engines throughout 2026.</p>
                </div>
            </div>
        </div>

        <!-- Centered Pagination Component -->
        <nav aria-label="Blog pagination" class="mb-4">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1">Previous</a>
                </li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>
            </ul>
        </nav>

        <!-- Simple Pager below -->
        <div class="d-flex justify-content-between">
            <button class="btn btn-outline-secondary">&larr; Older Posts</button>
            <button class="btn btn-outline-secondary">Newer Posts &rarr;</button>
        </div>
    </main>
</body>
</html>
