<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - Notifications Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Q6.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Card wrapping notifications -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold py-3">
                        <h1 class="h4 mb-0">System Notifications Dashboard</h1>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Dismissible Alert -->
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <strong>Success!</strong> You have 3 new messages in your inbox.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Info Alert -->
                        <div class="alert alert-info" role="alert">
                            <strong>Tip:</strong> You can enable two-factor authentication in your account settings.
                        </div>

                        <!-- Warning / Danger Alert -->
                        <div class="alert alert-danger" role="alert">
                            <strong>Warning:</strong> Your storage is 90% full. Please upgrade your plan.
                        </div>

                        <!-- Summary Well (Bordered, padded bg-light section) -->
                        <div class="summary-well p-3 mt-4 rounded bg-light border">
                            <h2 class="h6 text-uppercase fw-bold text-muted mb-2">Notification Summary</h2>
                            <p class="mb-0 text-secondary">Total Alerts Received Today: <strong>3</strong> | Critical: <strong>1</strong></p>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
