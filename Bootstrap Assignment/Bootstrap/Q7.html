<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 - Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Q7.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <!-- Header with Badge Counter -->
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h1 class="h4 fw-bold mb-0">Task Manager</h1>
                        <span class="badge bg-primary rounded-pill fs-6">Pending: 3</span>
                    </div>

                    <div class="card-body p-0">
                        <!-- Task List Group -->
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <div>
                                    <h6 class="mb-0 fw-bold">Fix Critical Server Bug</h6>
                                    <small class="text-muted">Assigned to DevOps</small>
                                </div>
                                <span class="badge bg-danger">High Priority</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <div>
                                    <h6 class="mb-0 fw-bold">Update Landing Page Copy</h6>
                                    <small class="text-muted">Assigned to Marketing</small>
                                </div>
                                <span class="badge bg-warning text-dark">Medium Priority</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <div>
                                    <h6 class="mb-0 fw-bold">Refactor CSS Modules</h6>
                                    <small class="text-muted">Assigned to Frontend Team</small>
                                </div>
                                <span class="badge bg-info text-dark">Low Priority</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Footer button with embedded badge -->
                    <div class="card-footer bg-white p-3 text-end">
                        <button class="btn btn-success">
                            Completed Tasks <span class="badge bg-white text-success ms-1">12</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
